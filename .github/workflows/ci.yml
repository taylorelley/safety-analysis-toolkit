name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install minimum supported Rust (Cargo.toml rust-version)
        run: rustup toolchain install 1.89 --profile minimal && rustup default 1.89
      - run: cargo test --locked
  clang:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    steps:
      - name: Install reference dependencies
        run: |
          apt-get update
          apt-get install -y clang-19 clang-tidy-19 llvm-19-dev libclang-19-dev libclang-rt-19-dev cmake g++ python3 python3-jsonschema curl ca-certificates git
          dpkg --compare-versions "$(clang-tidy-19 --version | sed -n 's/.*version \(19\.1\.[0-9]*\).*/\1/p')" ge 19.1.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache external SARIF schema with content pin
        run: make cache
      - run: make validation
      - name: Formal scope notice
        run: echo "Frama-C and ESBMC suites are not run in this LLVM job; no formal acceptance is claimed here."
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-evidence
          path: examples/**/.safety/runs/
          include-hidden-files: true
  clang-distribution-llvm:
    # Exercises the documented LLVM minimum with a non-reference 19.1.x
    # release (Ubuntu 24.04 ships 19.1.1); the clang job covers 19.1.7.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Ubuntu LLVM 19 packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 clang-tidy-19 llvm-19-dev libclang-19-dev libclang-rt-19-dev cmake
          version="$(clang-tidy-19 --version | sed -n 's/.*version \(19\.1\.[0-9]*\).*/\1/p')"
          echo "Distribution LLVM: $version"
          dpkg --compare-versions "$version" ge 19.1.0
          if [ "$version" = 19.1.7 ]; then echo "Runner provides the reference 19.1.7; this job no longer tests a non-reference release" >&2; exit 1; fi
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: make clang examples
      - name: Real Clang integration tests
        run: |
          PATH="$PWD/build/clang:/usr/lib/llvm-19/bin:$PATH" SAFETY_TEST_MODULE="$PWD/build/clang/SafetyMisra.so" \
            cargo test --locked -- --include-ignored --skip real_esbmc --skip real_frama_c
  reference-formal-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install externally reviewed validation analyzer (not redistributed)
        run: |
          mkdir -p build/external-esbmc
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/esbmc/esbmc/releases/download/v8.6/esbmc-linux.zip -o build/esbmc.zip
          echo '07b00b4a2590fe285edb5ce063ca2e5fbb368bbe556cfe139014c173717637f6  build/esbmc.zip' | sha256sum -c -
          unzip -q build/esbmc.zip -d build/external-esbmc
      - name: Fresh offline full validation and original-artifact packaging
        run: |
          SAFETY_ESBMC_DIR="$PWD/build/external-esbmc/release/bin" scripts/reference_validation.sh > validation-reference.log 2>&1
      - name: Preserve executed validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-validation-and-original-packages
          path: |
            validation-reference.log
            build/reference-results/
