[package]
name = "safety"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Local, evidence-preserving C/C++ analysis"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shlex = "1.3.0"
csv = "1.4.0"
libc = "0.2.177"

rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }

[dev-dependencies]
tempfile = "3.23.0"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[profile.dev.package.sha2]
opt-level = 3
