version: 1
target: navigate
property: enabled navigation returns one without a modeled memory error
source: navigation_harness.c
input_assumptions:
  - enabled is fixed to one by this harness; other inputs are outside its scope
environment_model: ESBMC sequential source and library model
build_configuration: SAFETY_DEMO=1, C11, 64-bit model
requirements: [R-NAV]
analyzer:
  engine: esbmc
  method: bmc
  entry: main
  bits: 64
  unwind: 8
